[package]
  cjc-version = "1.0.5"
  name = "glyphnet"
  description = "GlyphNet - SSH automation for network devices (netmiko-style), built on libssh2 via C FFI."
  version = "0.1.0"
  target-dir = ""
  output-type = "static"
  compile-option = ""
  override-compile-option = ""
  link-option = ""
  package-configuration = {}

[dependencies]

# Link-time resolution of libssh2.
# The KEY here is the real C library base name (-lssh2 -> libssh2.so); `path` is
# the directory searched for it. `vendor/lib/libssh2.so` is a repo-local symlink to
# the system-installed /usr/lib/<triple>/libssh2.so.1 -- see vendor/README.md.
# NOTE: this MUST be a top-level [ffi.c] table. A [target.<triple>.ffi.c] table is
# only consulted for cross-compilation (`cjpm build --target <triple>`) and is
# silently ignored for native builds.
[ffi.c]
  ssh2 = { path = "vendor/lib" }

# Windows (x86_64-w64-mingw32) cross-compilation.
# The socket layer resolves against ws2_32 (Winsock 2), whose import library
# ships with the SDK at third_party/mingw/lib/libws2_32.a and is already on
# cjc's search path for this target -- no `path` is needed.
# libssh2 is NOT listed here: no Windows build of it is vendored, so an
# executable for this target cannot be linked yet. See "Windows support" in
# README.md for exactly what is and is not proven.
[target.x86_64-w64-mingw32]
  link-option = "-lws2_32"
